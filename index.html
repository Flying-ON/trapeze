<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trapeze Wiki</title>

<style>
:root {
     --cream: #E9C785;
    --orange: #F39658;
    --coral: #F52A39;
    --teal: #47898C;
    --dark-teal: #357679;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    background: var(--dark-teal);
    color: white;
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    position: sticky;
    top: 0;
}

header h1 {
    max-width: 1200px;
    margin: auto;
    font-size: 2rem;
}

.container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1rem;
}

.accordion-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 1rem;
    overflow: hidden;
}

.accordion-header {
    width: 100%;
    background: var(--teal);
    color: white;
    border: none;
    padding: 1.25rem 1.5rem;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.accordion-header:hover {
    background: var(--orange);
}

.arrow {
    transition: transform 0.3s;
}

.accordion-item.active .arrow {
    transform: rotate(180deg);
}

.accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
    padding: 1rem 1.5rem 1.5rem;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0,0,0,.08);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card-content {
    padding: 1rem;
}

.card h3 {
    font-size: 1rem;
    margin-bottom: .35rem;
}

.card p {
    color: var(--subtext);
    font-size: .9rem;
}

.tag {
    display: inline-block;
    margin-top: .75rem;
    background: var(--coral);
    color: white;
    padding: .3rem .65rem;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 600;
}
</style>
</head>

<body>

<header>
    <h1>🎪 Flying Trapeze Wiki</h1>
</header>

<div class="container">

    <!-- Beginner -->
    <div class="accordion-item active">
        <button class="accordion-header">
            Beginner Tricks
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="kneehang.html" class="card">
                    <img src="https://picsum.photos/400/250?1">
                    <div class="card-content">
                        <h3>Knee Hang</h3>
                        <p>Foundation position and timing.</p>
                        <span class="tag">Beginner</span>
                    </div>
                </a>

                <a href="#" class="card">
                    <img src="https://picsum.photos/400/250?2">
                    <div class="card-content">
                        <h3>Bird's Nest</h3>
                        <p>Basic return progression.</p>
                        <span class="tag">Beginner</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- Intermediate -->
    <div class="accordion-item">
        <button class="accordion-header">
            Intermediate Tricks
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="#" class="card">
                    <img src="https://picsum.photos/400/250?3">
                    <div class="card-content">
                        <h3>Double Knee Hang</h3>
                        <p>Progression into advanced hanging skills.</p>
                        <span class="tag">Intermediate</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- Catch Tricks -->
    <div class="accordion-item">
        <button class="accordion-header">
            Catch Tricks
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="#" class="card">
                    <img src="https://picsum.photos/400/250?4">
                    <div class="card-content">
                        <h3>Layout</h3>
                        <p>Classic catch progression.</p>
                        <span class="tag">Catch</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- Returns -->
    <div class="accordion-item">
        <button class="accordion-header">
            Returns
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="#" class="card">
                    <img src="https://picsum.photos/400/250?5">
                    <div class="card-content">
                        <h3>Pullover Return</h3>
                        <p>Core return mechanics.</p>
                        <span class="tag">Return</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

</div>

<script>
const items = document.querySelectorAll('.accordion-item');

items.forEach(item => {
    const button = item.querySelector('.accordion-header');

    button.addEventListener('click', () => {

        items.forEach(other => {
            if (other !== item) {
                other.classList.remove('active');
                other.querySelector('.accordion-content').style.maxHeight = null;
            }
        });

        item.classList.toggle('active');

        const content = item.querySelector('.accordion-content');

        if (item.classList.contains('active')) {
            content.style.maxHeight = content.scrollHeight + 'px';
        } else {
            content.style.maxHeight = null;
        }
    });
});

// Open first section by default
document.querySelector('.accordion-content').style.maxHeight =
document.querySelector('.accordion-content').scrollHeight + 'px';
</script>

</body>
</html>
