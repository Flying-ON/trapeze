<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trapeze Wiki</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&display=swap" rel="stylesheet">


<style>
:root {
     --cream: #E9C785;
    --orange: #F39658;
    --coral: #F52A39;
    --teal: #47898C;
    --dark-teal: #357679;
    --bg: #f7f4ed;
    --text: #243b3d;
    --subtext: #647577;
    --card: #ffffff;
    --border: #dce5e2;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    background: var(--dark-teal);
    color: white;
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    position: sticky;
    top: 0;
    z-index: 2;
}

header h1 {
    max-width: 1200px;
    margin: auto;
    font-family: 'Fraunces', serif;
    font-size: 2rem;
}

.container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1rem;
}

.hero {
    min-height: 340px;
    display: flex;
    align-items: center;
    padding: 3rem max(2rem, calc((100% - 1200px) / 2));
    color: white;
    background:
        linear-gradient(90deg, rgba(26, 61, 63, .78), rgba(26, 61, 63, .12)),
        url("https://picsum.photos/1600/560?random=8") center 45% / cover;
}

.hero-content {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
}

.hero h2 {
    max-width: 100%;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    line-height: 1.08;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .24);
}

.hero p {
    max-width: 520px;
    margin: 1rem auto 0;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    line-height: 1.6;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .3);
}

.accordion-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 1rem;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(35, 66, 68, .12);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.accordion-item:hover {
    box-shadow: 0 10px 26px rgba(35, 66, 68, .17);
}

.accordion-header {
    width: 100%;
    background: var(--teal);
    color: white;
    border: none;
    padding: 1.25rem 1.5rem;
    font-size: 1.1rem;
    font-weight: 600;
    font-family: 'Fraunces', serif;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.accordion-header:hover {
    background: var(--orange);
}

.arrow {
    transition: transform 0.3s;
}

.accordion-item.active .arrow {
    transform: rotate(180deg);
}

.accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
    padding: 1rem 1.5rem 1.5rem;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 12px rgba(35, 66, 68, .1);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(0,0,0,.08);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card-content {
    padding: 1rem;
}

.card h3 {
    font-size: 1rem;
    margin-bottom: .35rem;
}

.card p {
    color: var(--subtext);
    font-size: .9rem;
}

.tag {
    display: inline-block;
    margin-top: .75rem;
    background: var(--coral);
    color: white;
    padding: .3rem .65rem;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 600;
}
</style>
</head>

<body>

<header>
    <h1>🎪 SBTC trapeze net</h1>
</header>

<section class="hero" aria-label="Flying trapeze introduction">
    <div class="hero-content">
        <h2>Trapeze Skills</h2>
        <p>Clear progressions for flying trapeze skills, with good quality videos.</p>
    </div>
</section>

<div class="container">

    <!-- Beginner -->
    <div class="accordion-item active">
        <button class="accordion-header">
            Beginner Tricks
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="trick.html?id=kneehang" class="card" data-trick-id="kneehang">
                    <img alt="">
                    <div class="card-content">
                        <h3></h3>
                        <p></p>
                        <div class="card-tags"></div>
                    </div>
                </a>

                <a href="trick.html?id=straddlewhip" class="card">
                    <img src="https://picsum.photos/400/250?2">
                    <div class="card-content">
                        <h3>Straddle Whip</h3>
                        <p>First set trick.</p>
                        <span class="tag">Beginner</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- Intermediate -->
    <div class="accordion-item">
        <button class="accordion-header">
            Intermediate Tricks
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="#" class="card">
                    <img src="https://picsum.photos/400/250?3">
                    <div class="card-content">
                        <h3>Penny Roll</h3>
                        <p>description</p>
                        <span class="tag">Intermediate</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- Swings -->
    <div class="accordion-item">
        <button class="accordion-header">
            Swings
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="#" class="card">
                    <img src="https://picsum.photos/400/250?4">
                    <div class="card-content">
                        <h3>Full Swing</h3>
                        <p>Bent leg, straight legs, and with pull.</p>
                        <span class="tag">Swing</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- Returns -->
    <div class="accordion-item">
        <button class="accordion-header">
            Back-end Tricks
            <span class="arrow">▼</span>
        </button>

        <div class="accordion-content">
            <div class="card-grid">

                <a href="#" class="card">
                    <img src="https://picsum.photos/400/250?5">
                    <div class="card-content">
                        <h3>Back End Split</h3>
                        <p>Core mechanics.</p>
                        <span class="tag">Back end</span>
                    </div>
                </a>

            </div>
        </div>
    </div>

</div>

<script src="data/tricks.js"></script>
<script>
document.querySelectorAll('[data-trick-id]').forEach(card => {
    const trick = tricks.find(item => item.id === card.dataset.trickId);

    if (!trick) {
        card.hidden = true;
        return;
    }

    card.querySelector('h3').textContent = trick.title;
    card.querySelector('p').textContent = trick.overview || '';

    const image = card.querySelector('img');
    image.src = trick.thumbnail || '';
    image.alt = `${trick.title} thumbnail`;

    const tagsContainer = card.querySelector('.card-tags');
    const tags = Array.isArray(trick.tags) ? trick.tags : [trick.tags];
    tags.filter(Boolean).forEach(tagText => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = tagText;
        tagsContainer.appendChild(tag);
    });
});

const items = document.querySelectorAll('.accordion-item');

items.forEach(item => {
    const button = item.querySelector('.accordion-header');

    button.addEventListener('click', () => {

        items.forEach(other => {
            if (other !== item) {
                other.classList.remove('active');
                other.querySelector('.accordion-content').style.maxHeight = null;
            }
        });

        item.classList.toggle('active');

        const content = item.querySelector('.accordion-content');

        if (item.classList.contains('active')) {
            content.style.maxHeight = content.scrollHeight + 'px';
        } else {
            content.style.maxHeight = null;
        }
    });
});

// Open first section by default
document.querySelector('.accordion-content').style.maxHeight =
document.querySelector('.accordion-content').scrollHeight + 'px';
</script>

</body>
</html>
